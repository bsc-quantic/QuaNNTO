name: Scientific and package checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/reproducible-py312.txt
      - run: python -m pip install --no-build-isolation -c requirements/reproducible-py312.txt -e '.[dev,sf]'
      - run: python -m quannto.benchmarks.prr
      - run: python -m pytest
      - run: python -m build --no-isolation
